services:
  web:
    build:
      context: ./backend_school
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend_school:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend_school/.env.docker
    depends_on:
      - redis

  celery_worker:
    build:
      context: ./backend_school
      dockerfile: Dockerfile
    command: celery -A backend_school worker -l info
    volumes:
      - ./backend_school:/app
    env_file:
      - ./backend_school/.env.docker
    depends_on:
      - redis
      - web

  celery_beat:
    build:
      context: ./backend_school
      dockerfile: Dockerfile
    command: celery -A backend_school beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend_school:/app
    env_file:
      - ./backend_school/.env.docker
    depends_on:
      - redis
      - web

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
